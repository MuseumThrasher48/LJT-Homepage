{% include base_path %}

<div class="page__footer-follow">
  <ul class="social-icons">
    <li><strong>Follow</strong></li>
    {% if site.author.github %}
      <li>
        <a href="https://github.com/{{ site.author.github }}" rel="me">
          <i class="fab fa-github" aria-hidden="true"></i> GitHub
        </a>
      </li>
    {% endif %}
  </ul>
</div>

<div class="page__footer-copyright">
  &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}, powered by
  <a href="https://jekyllrb.com" rel="nofollow">Jekyll</a> and
  <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a>,
  a fork of
  <a href="https://mademistakes.com/work/minimal-mistakes-jekyll-theme/" rel="nofollow">Minimal Mistakes</a>.
</div>
